[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smokeball-mcp"
version = "0.2.0"
description = "MCP server for Smokeball: matters, contacts, tasks, billing and documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["smokeball", "mcp", "legal", "law", "claude", "practice-management"]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.34.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

[project.scripts]
smokeball-mcp = "smokeball_mcp.server:main"
smokeball-mcp-setup = "smokeball_mcp.cli:setup_main"
smokeball-mcp-verify = "smokeball_mcp.cli:verify_main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/smokeball-mcp"
Repository = "https://github.com/RosenAdvertising/smokeball-mcp"
Issues = "https://github.com/RosenAdvertising/smokeball-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["smokeball_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
