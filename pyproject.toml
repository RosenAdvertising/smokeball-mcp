[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smokeball-mcp"
version = "0.1.0"
description = "MCP server for Smokeball API — full coverage for law firm practice management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["smokeball", "mcp", "legal", "law", "claude", "practice-management"]
dependencies = [
    "mcp>=1.27.2",
    "requests>=2.34.2",
    "keyring>=25.7.0",
]

[project.scripts]
smokeball-mcp = "smokeball_mcp.server:main"
smokeball-mcp-setup = "smokeball_mcp.setup.oauth_flow:main"
smokeball-mcp-verify = "smokeball_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/rosenadvertising/smokeball-mcp"
Issues = "https://github.com/rosenadvertising/smokeball-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["smokeball_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
